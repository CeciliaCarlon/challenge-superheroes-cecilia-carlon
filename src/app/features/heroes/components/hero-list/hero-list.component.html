<div class="arcade-container">
    @if (heroes$ | async; as heroes) {
        @if (heroes.length > 0) {
            <div class="heroes-grid" appDraggableScroll>
                @for (hero of heroes; track hero.id) {
                    <div class="hero-tab" [routerLink]="['/heroes', hero.id]">
                        <div class="image-wrapper">
                            <img loading="lazy"
                                [alt]="hero.name"
                                [draggable]="false"
                                [src]="hero.imageUrl || 'https://media.licdn.com/dms/image/v2/D4D12AQEbIpDYvCeAWQ/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1706125694124?e=2147483647&v=beta&t=HsmQkmxUTLIgu6IPZMoz7ihOWdBK4XBDJ7VHCVAJ0Z8'"
                            />
                            <div class="overlay-scanline"></div>
                        </div>

                        <div class="tab-info">
                            <span class="hero-name arcade-text">{{ hero.name | uppercase }}</span>
                        </div>
                    </div>
                }
            </div>
        } @else {
            <p class="no-heroes arcade-text">{{ NO_HEROES_MESSAGE }}</p>
        }
    } @else {
        <app-loading></app-loading>
    }
</div>
