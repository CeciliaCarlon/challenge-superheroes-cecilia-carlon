<div class="arcade-container">
    @if ($heroes(); as heroes) {
        <app-hero-search class="search-bar" (searchChange)="onSearchChange($event)"></app-hero-search>
        @if (heroes.length > 0) {
            <div class="carousel-wrapper ">
                <button mat-icon-button class="nav-arrow left" [disabled]="$currentPage() === 1" (click)="prevPage()">
                    <mat-icon>chevron_left</mat-icon>
                </button>
                
                <div class="heroes-grid">
                    @for (hero of $paginatedHeroes(); track hero.id) {
                        <div class="hero-tab" [routerLink]="['/heroes', hero.id]">
                            <div class="image-wrapper">
                                <img loading="lazy"
                                    [alt]="hero.name"
                                    [draggable]="false"
                                    [src]="hero.imageUrl || 'https://media.licdn.com/dms/image/v2/D4D12AQEbIpDYvCeAWQ/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1706125694124?e=2147483647&v=beta&t=HsmQkmxUTLIgu6IPZMoz7ihOWdBK4XBDJ7VHCVAJ0Z8'"
                                />
                                <div class="overlay-scanline"></div>
                            </div>

                            <div class="tab-info">
                                <span class="hero-name arcade-text">{{ hero.name | uppercase }}</span>
                            </div>
                        </div>
                    }
                </div>

                <button mat-icon-button class="nav-arrow right" [disabled]="$currentPage() === $totalPages()" (click)="nextPage()">
                    <mat-icon>chevron_right</mat-icon>
                </button>
            </div>

            <div class="dots-pagination">
                @for (page of $totalPagesArray(); track page) {
                    <span class="arcade-dot"
                        [class.active]="page === $currentPage()"
                        (click)="onPageChange(page)"
                    ></span>
                }
            </div>
        } @else {
            <p class="no-heroes arcade-text">{{ CONSTANTS.NO_HEROES_MESSAGE }}</p>
        }
    } @else {
        <app-loading></app-loading>
    }
</div>
